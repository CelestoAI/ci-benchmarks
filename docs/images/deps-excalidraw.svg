<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Celesto Large versus GitHub Actions: excalidraw dependency cache</title>
<desc id="desc">yarn install of excalidraw with actions/cache. Cold install: GitHub 47.2, Celesto 53.3 seconds. Warm restore plus install: GitHub 38.5, Celesto 40.7 seconds. Restore: GitHub 23.5, Celesto 21.1 seconds. Save: GitHub 12.2, Celesto 19.3 seconds. All bar axes begin at zero.</desc>
