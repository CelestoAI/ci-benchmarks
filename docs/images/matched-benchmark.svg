<g><rect x="568" y="160" width="516" height="252" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="596" y="196" class="panel-title">Four-core CPU</text><text x="1056" y="196" text-anchor="end" class="direction">Higher is better</text><text x="596" y="225" class="subtitle">Million iterations / second</text><line x1="598" x2="598" y1="264" y2="367" stroke="#e2e8f0"/><text x="598" y="392" text-anchor="middle" class="tick">0</text><line x1="730.6666666666666" x2="730.6666666666666" y1="264" y2="367" stroke="#e2e8f0"/><text x="730.6666666666666" y="392" text-anchor="middle" class="tick">400</text><line x1="863.3333333333333" x2="863.3333333333333" y1="264" y2="367" stroke="#e2e8f0"/><text x="863.3333333333333" y="392" text-anchor="middle" class="tick">800</text><line x1="996" x2="996" y1="264" y2="367" stroke="#e2e8f0"/><text x="996" y="392" text-anchor="middle" class="tick">1200</text><text x="598" y="262" class="label">GitHub Actions</text><rect x="598" y="272" width="260.91880273749996" height="24" rx="4" fill="#475569"/><text x="867.9188027375" y="291" class="value">786.7</text><text x="598" y="318" class="label">Celesto Large</text><rect x="598" y="328" width="307.6330559133333" height="24" rx="4" fill="#c2410c"/><text x="914.6330559133332" y="347" class="value">927.5</text></g>
