<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="928" viewBox="0 0 1120 928" role="img" aria-labelledby="title desc">
<title id="title">Celesto Large versus GitHub Actions: create-t3-turbo Turborepo cache</title>
<desc id="desc">create-t3-turbo, turbo run build typecheck lint, three cache setups. Medians in seconds. No cache: GitHub · actions/cache 62.1 s, Celesto · actions/cache 57.8 s, Celesto · Turbo remote 61.1 s. Same commit again: GitHub · actions/cache 2.6 s, Celesto · actions/cache 4.3 s, Celesto · Turbo remote 2.6 s. One page changed: GitHub · actions/cache 23.3 s, Celesto · actions/cache 21.2 s, Celesto · Turbo remote 19.1 s. Cache overhead, warm job: GitHub · actions/cache 2.0 s, Celesto · actions/cache 3.2 s, Celesto · Turbo remote 2.6 s. All bar axes begin at zero.</desc>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:750}.subtitle{font-size:18px;fill:#64748b}.panel-title{font-size:23px;font-weight:700}.direction{font-size:16px;fill:#64748b}.label{font-size:17px}.tick{font-size:16px;fill:#64748b}.value{font-size:19px;font-weight:700}.footer{font-size:17px;fill:#475569}</style>
