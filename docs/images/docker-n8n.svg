<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="928" viewBox="0 0 1120 928" role="img" aria-labelledby="title desc">
<title id="title">Celesto Large versus GitHub Actions: n8n Docker layer cache</title>
<desc id="desc">n8n image build with BuildKit type=gha cache. Medians in seconds. No cache: GitHub Actions 289.2 s, Celesto Large 341.7 s. Same input again: GitHub Actions 32.3 s, Celesto Large 41.4 s. App changed: GitHub Actions 136.5 s, Celesto Large 153.1 s. Cache export, cold build: GitHub Actions 80.8 s, Celesto Large 122.1 s. All bar axes begin at zero.</desc>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:750}.subtitle{font-size:18px;fill:#64748b}.panel-title{font-size:23px;font-weight:700}.direction{font-size:16px;fill:#64748b}.label{font-size:17px}.tick{font-size:16px;fill:#64748b}.value{font-size:19px;font-weight:700}.footer{font-size:17px;fill:#475569}</style>
<rect width="1120" height="928" rx="20" fill="#f8fafc"/>
<text x="36" y="55" class="title">A real Docker layer cache: n8n</text>
<text x="36" y="89" class="subtitle">docker/images/n8n/Dockerfile · BuildKit type=gha, mode=max · 4 vCPUs · 16 GiB RAM</text>
