# Cold clone, bun install and typecheck of anomalyco/opencode.
name: Node benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.provider }} ${{ matrix.iteration }}
    strategy:
      fail-fast: false
      matrix:
        provider: [celesto]
        iteration: [1, 2, 3]
    runs-on: [self-hosted, celesto-large]
    timeout-minutes: 30
    env:
      COMMIT: 08fb47373509ba64b13441061314eeacf4264f51
      BUN_VERSION: 1.3.14
      NODE_VERSION: 24.14.1
      NODE_GYP_VERSION: 12.4.0
      CI: 'true'
      OPENCODE_DISABLE_SHARE: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: .harness
      - name: Host check
        run: node .harness/scripts/record-event.mjs host_fingerprint "{}"
        env:
          BENCHMARK_PROVIDER: ${{ matrix.provider }}
          BENCHMARK_EVENT_FILE: ${{ runner.temp }}/events.jsonl
      - name: Use empty Bun dirs
        run: |
          echo "BUN_INSTALL=$RUNNER_TEMP/bun" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/bun/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/bun/bin" "$RUNNER_TEMP/bun-cache"
      - name: "phase: toolchain"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64-baseline.zip"
          unzip -q -j "$RUNNER_TEMP/bun.zip" bun-linux-x64-baseline/bun -d "$BUN_INSTALL/bin"
          command -v node >/dev/null || curl -fsSL "https://nodejs.org/download/release/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" | sudo tar -xz --strip-components=1 -C /usr/local
          bun --version; node --version
      - name: Native build tools
        run: |
          npm install -g --prefix "$RUNNER_TEMP/npm-global" "node-gyp@${NODE_GYP_VERSION}" >/dev/null
          echo "$RUNNER_TEMP/npm-global/bin" >> "$GITHUB_PATH"
      - name: "phase: clone"
        run: |
          mkdir work && cd work
          git init -q
          git remote add origin https://github.com/anomalyco/opencode.git
          git fetch -q --depth=1 origin "$COMMIT"
          git checkout -q --detach FETCH_HEAD
      - name: "phase: bun install"
        working-directory: work
        run: |
          for attempt in 1 2 3; do
            bun install && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::bun install attempt $attempt failed"
            rm -rf "$BUN_INSTALL_CACHE_DIR" node_modules
            sleep $((attempt * 5))
          done
          git diff --exit-code -- bun.lock package.json
      - name: "phase: typecheck"
        working-directory: work
        run: bun turbo typecheck --concurrency=4 '--cache=local:,remote:'

  collect:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: metrics-*
          path: metrics
      - run: node scripts/collect-suite.mjs node metrics results.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: results-node
          path: results.json
