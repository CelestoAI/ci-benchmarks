name: Docker benchmarks — matched GitHub vs Celesto
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pilot validates cache and workloads; full runs five repetitions.
        type: choice
        options: [pilot, full, native-probe, runtime-pilot]
        default: pilot
      namespace:
        description: Unique lowercase prefix; never reuse for a new experiment.
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  builds:
    if: inputs.mode != 'runtime-pilot'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        backend: ${{ fromJSON(inputs.mode == 'native-probe' && '["native"]' || '["portable","registry"]') }}
        repetition: ${{ fromJSON(inputs.mode == 'full' && '[1,2,3,4,5]' || '[1]') }}
    uses: ./.github/workflows/docker-build-pair.yml
    with:
      backend: ${{ matrix.backend }}
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
      mode: ${{ inputs.mode }}
  no-cache:
    needs: builds
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repetition: ${{ fromJSON(inputs.mode == 'full' && '[1,2,3,4,5]' || '[1]') }}
        provider: [github, celesto]
    uses: ./.github/workflows/docker-job.yml
    with:
      provider: ${{ matrix.provider }}
      backend: none
      scenario: nocache
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
  runtime:
    needs: no-cache
    if: always() && (inputs.mode == 'runtime-pilot' || needs.no-cache.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repetition: ${{ fromJSON(inputs.mode == 'full' && '[1,2,3,4,5]' || '[1]') }}
        provider: [celesto, github]
    uses: ./.github/workflows/docker-job.yml
    with:
      provider: ${{ matrix.provider }}
      backend: none
      scenario: runtime
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
  images:
    needs: runtime
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        repetition: ${{ fromJSON(inputs.mode == 'full' && '[1,2,3,4,5]' || '[1]') }}
    uses: ./.github/workflows/docker-image-pair.yml
    with:
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
