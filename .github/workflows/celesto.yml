name: Docker benchmarks — matched GitHub vs Celesto
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pilot validates cache and workloads; full runs five repetitions.
        type: choice
        options: [pilot, full, native-probe, runtime-pilot, image-pilot, continuation, image-full, portable-pair, registry-pair, image-pair, auth-probe]
        default: pilot
      repetition:
        description: Repetition number for a quota-controlled paired experiment.
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
      namespace:
        description: Unique lowercase prefix; never reuse for a new experiment.
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  auth:
    if: inputs.mode == 'auth-probe'
    strategy:
      fail-fast: false
      matrix:
        provider: [github, celesto]
    runs-on: ${{ fromJSON(matrix.provider == 'github' && '["ubuntu-24.04"]' || '["self-hosted","celesto-large"]') }}
    timeout-minutes: 5
    steps:
      - name: Check credentials directly with Docker Hub without logging secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.parse, urllib.error
          username, token = os.environ['DOCKERHUB_USERNAME'], os.environ['DOCKERHUB_TOKEN']
          print(json.dumps({'username_matches_expected_account':username=='aniketmaurya',
                            'token_character_count':len(token), 'token_has_surrounding_whitespace':token!=token.strip()}))
          assert username == 'aniketmaurya' and token and token == token.strip()
          query = urllib.parse.urlencode({'service':'registry.docker.io','scope':'repository:library/python:pull','account':username})
          request = urllib.request.Request('https://auth.docker.io/token?'+query,
              headers={'Authorization':'Basic '+base64.b64encode((username+':'+token).encode()).decode()})
          try:
              response = urllib.request.urlopen(request, timeout=20)
          except urllib.error.HTTPError as error:
              print(json.dumps({'docker_hub_auth_http_status':error.code}))
              raise SystemExit(1)
          data=json.load(response)
          assert data.get('token') or data.get('access_token')
          print(json.dumps({'docker_hub_auth_http_status':response.status,'registry_access_token_issued':True}))
          PY
      - name: Verify Docker CLI login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  builds:
    if: inputs.mode != 'runtime-pilot' && inputs.mode != 'image-pilot' && inputs.mode != 'continuation' && inputs.mode != 'image-full' && inputs.mode != 'image-pair' && inputs.mode != 'auth-probe'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        backend: ${{ fromJSON(inputs.mode == 'native-probe' && '["native"]' || inputs.mode == 'portable-pair' && '["portable"]' || inputs.mode == 'registry-pair' && '["registry"]' || '["portable","registry"]') }}
        repetition: ${{ fromJSON(inputs.mode == 'full' && '[1,2,3,4,5]' || (inputs.mode == 'portable-pair' || inputs.mode == 'registry-pair') && format('[{0}]', inputs.repetition) || '[1]') }}
    uses: ./.github/workflows/docker-build-pair.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      backend: ${{ matrix.backend }}
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
      mode: ${{ inputs.mode }}
  no-cache:
    needs: builds
    if: always() && (inputs.mode == 'continuation' || (inputs.mode != 'portable-pair' && inputs.mode != 'registry-pair' && needs.builds.result == 'success'))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repetition: ${{ fromJSON((inputs.mode == 'full' || inputs.mode == 'continuation') && '[1,2,3,4,5]' || '[1]') }}
        provider: [github, celesto]
    uses: ./.github/workflows/docker-job.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      provider: ${{ matrix.provider }}
      backend: none
      scenario: nocache
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
  runtime:
    needs: no-cache
    if: always() && (inputs.mode == 'runtime-pilot' || needs.no-cache.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repetition: ${{ fromJSON((inputs.mode == 'full' || inputs.mode == 'continuation') && '[1,2,3,4,5]' || '[1]') }}
        provider: [celesto, github]
    uses: ./.github/workflows/docker-job.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      provider: ${{ matrix.provider }}
      backend: none
      scenario: runtime
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
  images:
    needs: runtime
    if: always() && (inputs.mode == 'image-pilot' || inputs.mode == 'image-full' || inputs.mode == 'image-pair' || (inputs.mode != 'continuation' && needs.runtime.result == 'success'))
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repetition: ${{ fromJSON((inputs.mode == 'full' || inputs.mode == 'image-full') && '[1,2,3,4,5]' || inputs.mode == 'image-pair' && format('[{0}]', inputs.repetition) || '[1]') }}
    uses: ./.github/workflows/docker-image-pair.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
