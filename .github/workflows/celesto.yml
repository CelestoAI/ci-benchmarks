name: Docker benchmarks — matched GitHub vs Celesto
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pilot validates cache and workloads; full runs five repetitions.
        type: choice
        options: [pilot, full, native-probe, runtime-pilot, image-pilot, continuation, image-full, portable-pair, image-pair]
        default: pilot
      repetition:
        description: Repetition number for a quota-controlled paired experiment.
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
      namespace:
        description: Unique lowercase prefix; never reuse for a new experiment.
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  builds:
    if: inputs.mode != 'runtime-pilot' && inputs.mode != 'image-pilot' && inputs.mode != 'continuation' && inputs.mode != 'image-full' && inputs.mode != 'image-pair'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        backend: ${{ fromJSON(inputs.mode == 'native-probe' && '["native"]' || inputs.mode == 'portable-pair' && '["portable"]' || '["portable","registry"]') }}
        repetition: ${{ fromJSON(inputs.mode == 'full' && '[1,2,3,4,5]' || inputs.mode == 'portable-pair' && format('[{0}]', inputs.repetition) || '[1]') }}
    uses: ./.github/workflows/docker-build-pair.yml
    with:
      backend: ${{ matrix.backend }}
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
      mode: ${{ inputs.mode }}
  no-cache:
    needs: builds
    if: always() && (inputs.mode == 'continuation' || (inputs.mode != 'portable-pair' && needs.builds.result == 'success'))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repetition: ${{ fromJSON((inputs.mode == 'full' || inputs.mode == 'continuation') && '[1,2,3,4,5]' || '[1]') }}
        provider: [github, celesto]
    uses: ./.github/workflows/docker-job.yml
    with:
      provider: ${{ matrix.provider }}
      backend: none
      scenario: nocache
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
  runtime:
    needs: no-cache
    if: always() && (inputs.mode == 'runtime-pilot' || needs.no-cache.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repetition: ${{ fromJSON((inputs.mode == 'full' || inputs.mode == 'continuation') && '[1,2,3,4,5]' || '[1]') }}
        provider: [celesto, github]
    uses: ./.github/workflows/docker-job.yml
    with:
      provider: ${{ matrix.provider }}
      backend: none
      scenario: runtime
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
  images:
    needs: runtime
    if: always() && (inputs.mode == 'image-pilot' || inputs.mode == 'image-full' || inputs.mode == 'image-pair' || (inputs.mode != 'continuation' && needs.runtime.result == 'success'))
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repetition: ${{ fromJSON((inputs.mode == 'full' || inputs.mode == 'image-full') && '[1,2,3,4,5]' || inputs.mode == 'image-pair' && format('[{0}]', inputs.repetition) || '[1]') }}
    uses: ./.github/workflows/docker-image-pair.yml
    with:
      repetition: ${{ matrix.repetition }}
      namespace: ${{ inputs.namespace }}
