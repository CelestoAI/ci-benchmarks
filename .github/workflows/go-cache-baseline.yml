name: Go cache rollout benchmark

on:
  push:
    branches: [benchmark/go-cache-prod-rollout-20261123]
    paths: [.github/workflows/go-cache-baseline.yml]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOMAXPROCS: '4'
  BENCHMARK_GO_VERSION: '1.27.4'
  BENCHMARK_SOURCE: 559e729f9a8ed0d0f073f73985c016f82b212785

jobs:
  seed:
    name: Seed the Actions cache (${{ matrix.cache }})
    runs-on: celesto-large
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cache: [actions, actions-plus-go]
    env:
      CACHE_MODE: ${{ matrix.cache }}
      BENCHMARK_PHASE: seed
      EXPECTED_HIT: 'false'
    steps: &benchmark_steps
      - name: Check out pinned GitHub CLI
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cli/cli
          ref: ${{ env.BENCHMARK_SOURCE }}
          path: work
          persist-credentials: false

      - name: Record the JavaScript action cache route
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const url = process.env.ACTIONS_RESULTS_URL;
            const routes = ['http://127.0.0.1:8448', 'http://169.254.77.1:8448'];
            const route = url ? (routes.includes(new URL(url).origin) ? 'celesto' : 'upstream') : 'unset';
            core.info(`Actions cache route: ${route}`);
            core.exportVariable('BENCHMARK_CACHE_TRANSPORT', route);
            if (route !== 'celesto') core.setFailed('Expected the Celesto Actions cache route');

      - name: Prepare this build
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(nproc)" -eq 4
          printf '%s-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CACHE_MODE" > work/.benchmark-cache-key
          if [[ "$BENCHMARK_PHASE" != seed ]]; then
            cat > work/internal/ghcmd/go_cache_benchmark_edit.go <<'GO'
          package ghcmd

          import (
              "fmt"
              "os"
          )

          func init() {
              if os.Getenv("GO_CACHE_BENCHMARK_MARKER") == "1" {
                  fmt.Println("go-cache-benchmark-edit")
              }
          }
          GO
          fi
          printf 'BENCHMARK_SETUP_START=%s\n' "$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Set up Go and restore the Actions cache
        id: setup
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.BENCHMARK_GO_VERSION }}
          cache: true
          cache-dependency-path: |
            work/go.mod
            work/go.sum
            work/.benchmark-cache-key

      - name: Measure the build and verify the binary
        shell: bash
        working-directory: work
        env:
          ACTUAL_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          setup_end="$(date +%s%N)"
          test "$ACTUAL_HIT" = "$EXPECTED_HIT"
          case "$(go env GOCACHEPROG)" in
            *celesto-ci-cache-proxy*gocacheprog*) ;;
            *) echo 'Expected the production runner to supply the Go cache helper'; exit 1 ;;
          esac
          if [[ "$CACHE_MODE" == actions ]]; then
            export GOCACHEPROG=""
          fi
          test ! -e /var/tmp/celesto-go-cache/a || test -z "$(find /var/tmp/celesto-go-cache/a -type f -print -quit)"
          test ! -e /var/tmp/celesto-go-cache/remote-disabled
          start="$(date +%s%N)"
          go build -trimpath -buildvcs=false -p 4 -o "$RUNNER_TEMP/gh-benchmark" ./cmd/gh
          end="$(date +%s%N)"
          version="$(GO_CACHE_BENCHMARK_MARKER=1 "$RUNNER_TEMP/gh-benchmark" --version)"
          grep -q '^gh version ' <<< "$version"
          if [[ "$BENCHMARK_PHASE" != seed ]]; then
            grep -qx 'go-cache-benchmark-edit' <<< "$version"
          fi
          read -r digest _ < <(sha256sum "$RUNNER_TEMP/gh-benchmark")
          go_version="$(go env GOVERSION)"
          gcc_enabled="$(go env CGO_ENABLED)"
          remote_entries=0
          remote_bytes=0
          if [[ "$CACHE_MODE" == actions-plus-go ]]; then
            test -d /var/tmp/celesto-go-cache/a
            read -r remote_entries remote_bytes < <(
              find /var/tmp/celesto-go-cache/a -type f -exec cat {} + |
                awk '$3 == "1970-01-01T00:00:00Z" {count++; bytes+=$2} END {printf "%d %.0f\n", count, bytes}'
            )
            if [[ "$BENCHMARK_PHASE" != seed ]]; then
              test "$remote_entries" -gt 0
            fi
          fi
          {
            printf 'Phase: %s\n' "$BENCHMARK_PHASE"
            printf 'Source: %s\n' "$BENCHMARK_SOURCE"
            printf 'Go: %s\n' "$go_version"
            printf 'CGO: %s\n' "$gcc_enabled"
            printf 'Cache mode: %s\n' "$CACHE_MODE"
            printf 'Go entries fetched from remote: %s\n' "$remote_entries"
            printf 'Go entry bytes fetched from remote: %s\n' "$remote_bytes"
            printf 'Actions cache route: %s\n' "$BENCHMARK_CACHE_TRANSPORT"
            printf 'Actions archive hit: %s\n' "$ACTUAL_HIT"
            printf 'Setup Go and cache restore (ms): %s\n' "$(((setup_end - BENCHMARK_SETUP_START) / 1000000))"
            printf 'Build (ms): %s\n' "$(((end - start) / 1000000))"
            printf 'Binary SHA-256: %s\n' "$digest"
          } | tee "$RUNNER_TEMP/go-baseline.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-rollout-${{ env.CACHE_MODE }}-${{ env.BENCHMARK_PHASE }}
          path: ${{ runner.temp }}/go-baseline.txt
          if-no-files-found: error
          retention-days: 30

  edited:
    name: Build the code edit on a fresh runner (${{ matrix.cache }})
    needs: seed
    runs-on: celesto-large
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cache: [actions, actions-plus-go]
    env:
      CACHE_MODE: ${{ matrix.cache }}
      BENCHMARK_PHASE: edited
      EXPECTED_HIT: 'true'
    steps: *benchmark_steps

  repeat:
    name: Repeat the edit on another fresh runner (${{ matrix.cache }})
    needs: edited
    runs-on: celesto-large
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cache: [actions, actions-plus-go]
    env:
      CACHE_MODE: ${{ matrix.cache }}
      BENCHMARK_PHASE: repeat
      EXPECTED_HIT: 'true'
    steps: *benchmark_steps
