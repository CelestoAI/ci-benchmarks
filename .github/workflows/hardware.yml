# CPU, memory, disk, network, Docker and PostgreSQL tests on each provider.
# Same tools and settings as the runs-on.com hardware suite.
name: Hardware benchmark

on:
  workflow_dispatch:
  push:
    branches: [hardware-suite]
    paths: [.github/workflows/hardware.yml, scripts/hardware-bench.mjs]

permissions:
  contents: read

jobs:
  hardware:
    name: ${{ matrix.runner.provider }} ${{ matrix.iteration }}
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3]
        runner:
          - provider: github-hosted
            labels: '["ubuntu-24.04"]'
          - provider: celesto-large
            labels: '["self-hosted","celesto-large"]'
    runs-on: ${{ fromJSON(matrix.runner.labels) }}
    timeout-minutes: 45
    env:
      METRICS: ${{ github.workspace }}/hardware-metrics.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Record host
        run: node scripts/record-event.mjs host_fingerprint '{}'
        env:
          BENCHMARK_PROVIDER: ${{ matrix.runner.provider }}
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sysbench fio p7zip-full postgresql-client unzip
      - name: cpu
        continue-on-error: true
        run: node scripts/hardware-bench.mjs cpu "$METRICS"
      - name: passmark
        continue-on-error: true
        run: node scripts/hardware-bench.mjs passmark "$METRICS"
      - name: memory
        continue-on-error: true
        run: node scripts/hardware-bench.mjs memory "$METRICS"
      - name: disk
        continue-on-error: true
        run: node scripts/hardware-bench.mjs disk "$METRICS"
      - name: network
        continue-on-error: true
        run: node scripts/hardware-bench.mjs network "$METRICS"
      - name: docker
        continue-on-error: true
        run: node scripts/hardware-bench.mjs docker "$METRICS"
      - name: postgres
        continue-on-error: true
        run: node scripts/hardware-bench.mjs postgres "$METRICS"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-${{ matrix.runner.provider }}-${{ matrix.iteration }}
          path: |
            hardware-metrics.json
            benchmark-events.jsonl
