name: Native single-job cancellation proof
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: One-off label for the isolated runner
        required: true
        type: string
permissions: {}
jobs:
  cancel-target:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 4
    steps:
      - name: Wait for native cancellation
        run: sleep 180
      - name: Unconditional step after cancellation
        if: always()
        run: echo target-cleanup
  sibling:
    runs-on: celesto
    timeout-minutes: 4
    steps:
      - name: Finish independently
        run: |
          sleep 10
          echo sibling-finished
