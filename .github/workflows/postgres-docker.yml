name: Postgres 17 native service smoke
run-name: Postgres 17 on Celesto localhost port 5432

on:
  workflow_dispatch:

permissions: {}

jobs:
  postgres17:
    name: Postgres 17 through localhost:5432
    runs-on: [self-hosted, celesto-large]
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: celesto_smoke
          POSTGRES_PASSWORD: disposable-service-password
          POSTGRES_DB: celesto_smoke
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U celesto_smoke -d celesto_smoke"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Connect from the runner VM and verify a SQL round trip
        shell: bash
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: celesto_smoke
          PGPASSWORD: disposable-service-password
          PGDATABASE: celesto_smoke
          PGCONNECT_TIMEOUT: "5"
          SERVICE_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == celesto-rs-* ]]
          [[ "$SERVICE_PORT" == "$PGPORT" ]]
          version_num="$(psql -XAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num')"
          [[ "$version_num" -ge 170000 && "$version_num" -lt 180000 ]]
          result="$(psql -XqAt -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TEMP TABLE smoke (value integer NOT NULL);
          INSERT INTO smoke VALUES (42);
          SELECT value FROM smoke;
          SQL
          )"
          [[ "$result" == 42 ]]
          version="$(psql -XAt -v ON_ERROR_STOP=1 -c 'SHOW server_version')"
          printf 'runner=%s endpoint=%s:%s postgres_version=%s server_version_num=%s sql_result=%s\n' \
            "$RUNNER_NAME" "$PGHOST" "$PGPORT" "$version" "$version_num" "$result"
