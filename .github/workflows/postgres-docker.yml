name: Single-job runner signal proof
on:
  workflow_dispatch:
permissions: {}
jobs:
  cancel-target:
    runs-on: celesto
    timeout-minutes: 4
    steps:
      - name: Wait for operator cancel
        run: sleep 180
  sibling:
    runs-on: celesto
    timeout-minutes: 4
    steps:
      - name: Finish independently
        run: |
          sleep 15
          echo sibling-finished
