name: Celesto alias retirement smoke
run-name: Celesto alias retirement smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  bare-cloud:
    runs-on: celesto-cloud
    timeout-minutes: 4
    steps:
      - name: Verify the Micro runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == celesto-rs-* ]]
          [[ "$(nproc)" == 1 ]]
          printf 'runner=%s vcpus=%s\n' "$RUNNER_NAME" "$(nproc)"

  retired-micro:
    runs-on: celesto-cloud-micro
    timeout-minutes: 4
    steps:
      - run: exit 1

  retired-standard:
    runs-on: celesto-cloud-standard
    timeout-minutes: 4
    steps:
      - run: exit 1

  retired-large:
    runs-on: celesto-cloud-large
    timeout-minutes: 4
    steps:
      - run: exit 1

  retired-xl:
    runs-on: celesto-cloud-xl
    timeout-minutes: 4
    steps:
      - run: exit 1
