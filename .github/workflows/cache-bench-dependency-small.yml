# Cache benchmark: small dependency cache (facebook/prop-types, an archive under 128 MiB, which the
# cache action uploads in one request), GitHub Actions vs Celesto CI. Cold jobs start empty
# and save; warm jobs run on fresh runners and restore what cold saved.
# Summarize with: node cache-bench/collect.mjs <run-id>
name: Cache benchmark - Dependency cache (small)
on:
  # A new workflow can be dispatched only from the default branch; until this
  # lands on main, pushing a cache-bench/dependency/** branch runs it with the defaults.
  push:
    branches: ['cache-bench/dependency-small/**']
  workflow_dispatch:
    inputs:
      namespace:
        description: New unique name per experiment (cold and warm share it)
        type: string
        required: true
      celesto_runner:
        description: Celesto runner label (match GitHub's 4 vCPU / 16 GiB)
        type: string
        default: celesto-large
permissions:
  contents: read
jobs:
  cold:
    strategy:
      fail-fast: false
      matrix:
        sample: ['1', '2', '3']
        provider: [github, celesto]
    uses: ./.github/workflows/cache-bench-job.yml
    with:
      cache: dependency
      phase: cold
      provider: ${{ matrix.provider }}
      runs_on: ${{ matrix.provider == 'github' && '["ubuntu-24.04"]' || format('["self-hosted","{0}"]', inputs.celesto_runner || 'celesto-large') }}
      key: ${{ inputs.namespace || format('run{0}-{1}', github.run_id, github.run_attempt) }}-dependency-small-${{ matrix.provider }}-s${{ matrix.sample }}
      sample: ${{ matrix.sample }}
      dep_repository: facebook/prop-types
      dep_ref: 1c9c6311c1fb8778bffc7a1ca70c273ee8a8654d
  warm:
    needs: cold
    if: always()
    strategy:
      fail-fast: false
      matrix:
        sample: ['1', '2', '3']
        provider: [github, celesto]
    uses: ./.github/workflows/cache-bench-job.yml
    with:
      cache: dependency
      phase: warm
      provider: ${{ matrix.provider }}
      runs_on: ${{ matrix.provider == 'github' && '["ubuntu-24.04"]' || format('["self-hosted","{0}"]', inputs.celesto_runner || 'celesto-large') }}
      key: ${{ inputs.namespace || format('run{0}-{1}', github.run_id, github.run_attempt) }}-dependency-small-${{ matrix.provider }}-s${{ matrix.sample }}
      sample: ${{ matrix.sample }}
      dep_repository: facebook/prop-types
      dep_ref: 1c9c6311c1fb8778bffc7a1ca70c273ee8a8654d
