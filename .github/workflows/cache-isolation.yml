# Cache isolation (poisoning) tests on Celesto CI.
# Plan: backend docs/designs/ci-actions-cache.md A-05 and the branch scoping
# of docs/designs/ci-docker-layer-cache.md. cache-tests/README.md has the
# full order (main, two branches, a pull request, another repository).
#
# phase=save   : save `iso-<key>` = this branch's name, and build an image
#                whose /owner.txt is this branch's name (same Docker scope on
#                every branch).
# phase=verify : restore and rebuild; fails if a job ever sees another
#                branch's content. Also sends lookups with a tampered token.
# foreign_key  : a key only ANOTHER repository saved; it must miss here.
name: Cache tests - isolation
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [save, verify]
        default: save
      key:
        type: string
        required: true
      foreign_key:
        description: Optional key saved only by another repository (must miss)
        type: string
        default: ''
      runner:
        type: string
        default: celesto-large
  # PR scope: a pull request saves under its own scope; main must not see it.
  pull_request:
    paths: [cache-tests/pr-scope/**]
permissions:
  contents: read
jobs:
  dependency:
    name: Branch-scoped actions/cache
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 20
    steps:
      - name: Content for this branch
        if: inputs.phase == 'save'
        run: mkdir -p iso && echo "${GITHUB_REF_NAME}" > iso/owner.txt
      - if: inputs.phase == 'save'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: iso
          key: iso-${{ inputs.key }}
      - if: inputs.phase == 'verify'
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: iso
          key: iso-${{ inputs.key }}
      - name: Only this branch's (or main's fallback) content
        if: inputs.phase == 'verify'
        run: |
          got=$(cat iso/owner.txt 2>/dev/null || echo "<miss>")
          echo "branch=${GITHUB_REF_NAME} hit=${{ steps.restore.outputs.cache-hit }} restored-owner=${got}"
          case "$got" in
            "${GITHUB_REF_NAME}"|main) echo PASS ;;
            *) echo "POISONING or miss: ${GITHUB_REF_NAME} restored ${got}"; exit 1 ;;
          esac
      - name: A PR's cache never reaches this branch
        if: inputs.phase == 'verify'
        id: pr
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pr
          key: pr-scope-${{ inputs.key }}
      - if: inputs.phase == 'verify'
        run: |
          echo "PR entry hit=${{ steps.pr.outputs.cache-hit }}"
          [ "${{ steps.pr.outputs.cache-hit }}" != true ] || { echo "POISONING: read a pull request's cache"; exit 1; }
          echo PASS

  docker:
    name: Branch-scoped Docker layers
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: cache-tests/poison
          load: true
          tags: cache-isolation:local
          build-args: CONTENT=${{ github.ref_name }}
          cache-from: type=gha,scope=iso-${{ inputs.key }}
          cache-to: type=gha,mode=max,scope=iso-${{ inputs.key }}
      - name: The image holds this branch's content
        run: |
          got=$(docker run --rm cache-isolation:local cat /owner.txt)
          echo "branch=${GITHUB_REF_NAME} image-owner=${got}"
          [ "$got" = "${GITHUB_REF_NAME}" ] || { echo "POISONING: image contains ${got}"; exit 1; }
          echo PASS

  tampered-token:
    name: A tampered runtime token gets nothing
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'verify'
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3
      # Claims a branch this job may not read; the API must reject the token
      # (Axiom: reason=invalid_token), see cache-tests/README.md.
      - run: python3 cache-tests/poison/forge.py ${{ github.ref_name == 'cache-test-a' && 'refs/heads/cache-test-b' || 'refs/heads/cache-test-a' }} iso-${{ inputs.key }} any-version

  other-repository:
    name: Another repository's key misses
    if: github.event_name == 'workflow_dispatch' && inputs.foreign_key != ''
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 10
    steps:
      - id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: iso
          key: iso-${{ inputs.foreign_key }}
      - run: |
          echo "foreign key hit=${{ steps.restore.outputs.cache-hit }}"
          [ "${{ steps.restore.outputs.cache-hit }}" != true ] || { echo "POISONING: read another repository's cache"; exit 1; }
          echo PASS

  pull-request:
    name: A pull request saves under its own scope
    # Only branches of this repository: fork pull requests never reach Celesto runners.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, celesto-large]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Key from the marker file
        id: key
        run: echo "key=$(tail -1 cache-tests/pr-scope/marker.txt)" >> "$GITHUB_OUTPUT"
      - run: mkdir -p pr && echo "pull-request" > pr/owner.txt
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pr
          key: pr-scope-${{ steps.key.outputs.key }}
      - name: The pull request still reads main's entry (fallback)
        id: fallback
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: iso
          key: iso-${{ steps.key.outputs.key }}
      - run: |
          echo "main fallback hit=${{ steps.fallback.outputs.cache-hit }} owner=$(cat iso/owner.txt 2>/dev/null || echo '<miss>')"
          test "$(cat iso/owner.txt)" = main && echo PASS
