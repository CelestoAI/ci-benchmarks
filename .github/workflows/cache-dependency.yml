# Dependency cache tests on Celesto CI (actions/cache, setup-node).
#
# Run twice with the same key: phase=save, then phase=verify.
# `verify` fails if any restore misses or returns other content.
name: Cache tests - dependency
on:
  workflow_dispatch:
    inputs:
      phase:
        description: save, then verify
        type: choice
        options: [save, verify]
        default: save
      key:
        description: New unique key per test (same key for save and verify)
        type: string
        required: true
      providers:
        description: Where to run (JSON list of celesto, github)
        type: string
        default: '["celesto","github"]'
      runner:
        description: Celesto runner label
        type: string
        default: celesto
permissions:
  contents: read
jobs:
  vm:
    name: VM cache (setup-node, actions/cache, restore keys) (${{ matrix.provider }})
    runs-on: ${{ fromJSON(matrix.provider == 'github' && '["ubuntu-24.04"]' || format('["self-hosted","{0}"]', inputs.runner)) }}
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.providers) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup-node npm cache
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docker-bench/node/package-lock.json
      - name: Content for this key
        run: mkdir -p .cache-test && echo "dep-${{ inputs.key }}" > .cache-test/content.txt
      - name: Save (phase save)
        if: inputs.phase == 'save'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache-test
          key: dep-${{ inputs.key }}
      - name: Exact restore (phase verify)
        if: inputs.phase == 'verify'
        id: exact
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache-test
          key: dep-${{ inputs.key }}
      - name: Restore by prefix through restore-keys (phase verify)
        if: inputs.phase == 'verify'
        id: prefix
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache-test
          key: dep-${{ inputs.key }}-no-such-key
          restore-keys: dep-${{ inputs.key }}
      - name: Check the restores
        if: inputs.phase == 'verify'
        run: |
          echo "setup-node npm hit=${{ steps.node.outputs.cache-hit }}"
          echo "exact hit=${{ steps.exact.outputs.cache-hit }} matched=${{ steps.exact.outputs.cache-matched-key }}"
          echo "prefix matched=${{ steps.prefix.outputs.cache-matched-key }}"
          test "${{ steps.exact.outputs.cache-hit }}" = true
          test "${{ steps.prefix.outputs.cache-matched-key }}" = "dep-${{ inputs.key }}"
          test "$(cat .cache-test/content.txt)" = "dep-${{ inputs.key }}"
          echo PASS

  container:
    name: Job container cache (${{ matrix.provider }})
    runs-on: ${{ fromJSON(matrix.provider == 'github' && '["ubuntu-24.04"]' || format('["self-hosted","{0}"]', inputs.runner)) }}
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.providers) }}
    timeout-minutes: 20
    container: node:22
    steps:
      - name: Content for this key
        run: mkdir -p .cache-test && echo "container-${{ inputs.key }}" > .cache-test/content.txt
      - if: inputs.phase == 'save'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache-test
          key: container-${{ inputs.key }}
      - if: inputs.phase == 'verify'
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache-test
          key: container-${{ inputs.key }}
      - if: inputs.phase == 'verify'
        run: |
          echo "container hit=${{ steps.restore.outputs.cache-hit }}"
          test "${{ steps.restore.outputs.cache-hit }}" = true && echo PASS

  artifact-upload:
    name: Artifact upload with the cache on (${{ matrix.provider }})
    runs-on: ${{ fromJSON(matrix.provider == 'github' && '["ubuntu-24.04"]' || format('["self-hosted","{0}"]', inputs.runner)) }}
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.providers) }}
    timeout-minutes: 10
    steps:
      - run: mkdir -p proof && echo "${{ github.run_id }}-${{ github.run_attempt }}" > proof/proof.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-test-proof-${{ inputs.phase }}-${{ matrix.provider }}
          path: proof/

  artifact-download:
    name: Artifact download in a later job (${{ matrix.provider }})
    needs: artifact-upload
    runs-on: ${{ fromJSON(matrix.provider == 'github' && '["ubuntu-24.04"]' || format('["self-hosted","{0}"]', inputs.runner)) }}
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.providers) }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cache-test-proof-${{ inputs.phase }}-${{ matrix.provider }}
          path: proof/
      - run: test "$(cat proof/proof.txt)" = "${{ github.run_id }}-${{ github.run_attempt }}" && echo PASS
