name: Docker Hub mirror probe on Celesto runner
# Prototype for baking mirror.gcr.io into the github-ci image. Turns the
# mirror on inside the job, then checks that dockerd and a buildx builder use
# it and that dockerd falls back to Docker Hub when the mirror is unreachable.
# A pull served by the mirror leaves the anonymous Docker Hub allowance unchanged.
on:
  workflow_dispatch:
  push:
    branches: [ci/docker-mirror-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, celesto-large]
    timeout-minutes: 15
    steps:
      - name: Helpers
        run: |
          # sudo only when the job is not already root.
          if [ "$(id -u)" = 0 ]; then echo "SUDO=" >> "$GITHUB_ENV"; else echo "SUDO=sudo -n" >> "$GITHUB_ENV"; fi
          cat > /tmp/quota.py <<'PY'
          import json, sys, urllib.request
          # HEAD requests on Docker's test image do not count against the limit.
          url = ('https://auth.docker.io/token?service=registry.docker.io'
                 '&scope=repository:ratelimitpreview/test:pull')
          with urllib.request.urlopen(url, timeout=20) as response:
              token = json.load(response)['token']
          request = urllib.request.Request(
              'https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest',
              method='HEAD', headers={'Authorization': 'Bearer ' + token})
          with urllib.request.urlopen(request, timeout=20) as response:
              print(response.headers.get('ratelimit-remaining', 'unknown').split(';')[0])
          PY
          cat > /tmp/set-mirror.sh <<'SH'
          # Write daemon.json and SIGHUP dockerd: registry-mirrors reloads live.
          set -eu
          $SUDO mkdir -p /etc/docker
          printf '{"registry-mirrors": ["%s"]}\n' "$1" | $SUDO tee /etc/docker/daemon.json
          $SUDO kill -HUP "$(pgrep -x dockerd)"
          sleep 2
          docker info --format 'mirrors now: {{json .RegistryConfig.Mirrors}}'
          SH
          chmod +x /tmp/set-mirror.sh
      - name: Docker version and image store
        run: |
          docker version --format 'server {{.Server.Version}}'
          docker info --format 'storage driver: {{.Driver}}  status: {{json .DriverStatus}}'
          docker info --format 'mirrors before: {{json .RegistryConfig.Mirrors}}'
      - name: dockerd pulls through mirror.gcr.io
        run: |
          /tmp/set-mirror.sh https://mirror.gcr.io
          before=$(python3 /tmp/quota.py)
          for image in postgres:17 python:3.12 node:22 redis:7 mysql:8.4; do
            start=$(date +%s)
            docker pull -q "$image" >/dev/null
            echo "pulled $image in $(( $(date +%s) - start ))s"
          done
          after=$(python3 /tmp/quota.py)
          echo "docker hub allowance: before=$before after=$after"
          echo "DOCKERD_USED=$(( before - after ))" >> "$GITHUB_ENV"
      - name: Job user and buildx default config location
        run: |
          echo "user=$(id -un) home=$HOME BUILDX_CONFIG=${BUILDX_CONFIG:-unset}"
          docker buildx version
          # buildx applies buildkitd.default.toml from its config dir to every
          # new docker-container builder; the image would bake this file.
          mkdir -p "$HOME/.docker/buildx"
          printf '[registry."docker.io"]\n  mirrors = ["mirror.gcr.io"]\n' > "$HOME/.docker/buildx/buildkitd.default.toml"
      - name: Stock setup-buildx-action, no buildkitd config input
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: buildx FROM pull goes through the mirror
        run: |
          mkdir -p /tmp/bk && cd /tmp/bk
          printf 'FROM ruby:3.3-slim\nRUN true\n' > Dockerfile
          docker buildx inspect | sed -n 1,20p
          builder=$(docker buildx inspect --format '{{.Name}}' 2>/dev/null || docker buildx inspect | awk '/^Name:/{print $2; exit}')
          docker exec "buildx_buildkit_${builder}0" cat /etc/buildkit/buildkitd.toml || true
          before=$(python3 /tmp/quota.py)
          docker buildx build --progress plain .
          after=$(python3 /tmp/quota.py)
          echo "docker hub allowance around buildx build: before=$before after=$after"
      - name: Fallback to Docker Hub when the mirror is unreachable
        run: |
          # Port 9 on loopback refuses connections: a mirror that is down.
          /tmp/set-mirror.sh http://127.0.0.1:9
          before=$(python3 /tmp/quota.py)
          docker pull -q busybox:1.37 && echo "fallback pull succeeded"
          after=$(python3 /tmp/quota.py)
          echo "docker hub allowance with mirror down: before=$before after=$after (a drop means Docker Hub served it)"
      - name: Result
        if: always()
        run: |
          echo "Docker Hub pulls used by 5 dockerd pulls through the mirror: ${DOCKERD_USED:-unknown}"
          $SUDO tail -n 40 /var/log/celesto-docker.log || true
