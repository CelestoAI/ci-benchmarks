# Read-only probe of the runner guest: CPU, clock, kernel, memory, disk queue
# and network settings, plus short micro-benchmarks.
name: Guest probe

on:
  push:
    branches: [inspect/guest-config]
    paths: ['.github/workflows/guest-probe.yml', 'inspect/guest/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.provider }} ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { provider: celesto, n: 1, runs_on: celesto-large }
          - { provider: celesto, n: 2, runs_on: celesto-large }
          - { provider: celesto, n: 3, runs_on: celesto-large }
          - { provider: celesto, n: 4, runs_on: celesto-large }
          - { provider: celesto, n: 5, runs_on: celesto-large }
          - { provider: celesto, n: 6, runs_on: celesto-large }
          - { provider: github, n: 1, runs_on: ubuntu-24.04 }
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sysbench strace gcc >/dev/null
      - name: Probe settings
        run: bash inspect/guest/probe.sh
      - name: Micro-benchmarks
        run: bash inspect/guest/bench.sh
