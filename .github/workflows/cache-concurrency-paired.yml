name: Proxy to R2 timed first downloads
on:
  push:
    branches: [codex/cache-proxy-r2-timing-20261117]
permissions:
  contents: read
concurrency:
  group: cache-proxy-r2-timing-20261117
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: celesto-large
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: .harness
      - name: Build instrumented released helper
        env:
          MATRIX_SOURCE_URL: ${{ secrets.PROXY_R2_TIMING_SOURCE_20261117 }}
          MATRIX_SOURCE_SHA256: 9ba9a751f99fb021a2572604541aec45b59ef60f6379aebe5427bff9292e4356
        run: python3 .harness/scripts/cache-concurrency-paired.py setup
      - name: Run ten alternating first-download pairs
        uses: ./.harness/.github/actions/cache-concurrency-paired
        env:
          MATRIX_PROGRESS_PUT_URL: ${{ secrets.PROXY_R2_TIMING_PROGRESS_20261117 }}
      - name: Restore published helper
        if: always()
        run: python3 .harness/scripts/cache-concurrency-paired.py cleanup
      - name: Publish paired receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-proxy-r2-timing-receipts
          path: /tmp/cache-proxy-r2-timing-${{ github.run_id }}-${{ github.run_attempt }}/results
          if-no-files-found: warn
