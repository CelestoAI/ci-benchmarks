name: TCP and R2 timed first downloads
on:
  push:
    branches: [codex/cache-tcp-r2-20261117]
permissions:
  contents: read
concurrency:
  group: cache-tcp-r2-20261117
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: celesto-large
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: .harness
      - name: Build instrumented released helper
        env:
          MATRIX_SOURCE_URL: ${{ secrets.TCP_R2_SOURCE_20261117 }}
          MATRIX_SOURCE_SHA256: b05af0a507fa9394b2a3fffcb4cf44aa25a8eb46583c388b2fccc675cc622b6c
        run: python3 .harness/scripts/cache-concurrency-paired.py setup
      - name: Run ten alternating first-download pairs
        uses: ./.harness/.github/actions/cache-concurrency-paired
        env:
          MATRIX_PROGRESS_PUT_URL: ${{ secrets.TCP_R2_PROGRESS_20261117 }}
      - name: Restore published helper
        if: always()
        run: python3 .harness/scripts/cache-concurrency-paired.py cleanup
      - name: Publish paired receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-tcp-r2-receipts
          path: /tmp/cache-tcp-r2-${{ github.run_id }}-${{ github.run_attempt }}/results
          if-no-files-found: warn
