# Real-repo Turborepo cache benchmark: create-t3-turbo, `turbo run build typecheck lint`.
# cold (empty cache), warm (same commit: every task should hit), partial (one Next.js
# page changed: only its tasks rerun). 3 samples per variant per phase:
#   github-hosted / actions-cache, celesto-large / actions-cache, celesto-large / turbo-remote.
name: Real-repo Turborepo cache benchmark
on:
  push:
    branches: [deps-real-repo-bench]
    paths: ['.bench/turbo']
  workflow_dispatch:
    inputs:
      cache_namespace: { type: string, required: false, description: Unique per run }
permissions:
  contents: read
jobs:
  cold:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
        variant:
          - { provider: github-hosted, method: actions-cache, labels: '["ubuntu-24.04"]' }
          - { provider: celesto-large, method: actions-cache, labels: '["self-hosted","celesto-large"]' }
          - { provider: celesto-large, method: turbo-remote, labels: '["self-hosted","celesto-large"]' }
    uses: ./.github/workflows/turbo-real-repo-job.yml
    with:
      phase: cold
      provider: ${{ matrix.variant.provider }}
      method: ${{ matrix.variant.method }}
      runs_on: ${{ matrix.variant.labels }}
      key: turbo-${{ inputs.cache_namespace || github.run_id }}-${{ matrix.variant.provider }}-${{ matrix.variant.method }}-s${{ matrix.sample }}
      sample: ${{ matrix.sample }}
      repo: t3-oss/create-t3-turbo
      sha: 8f945b7bb3bfb3ca8358d48b1ff0214079bc11ee
      edit_file: apps/nextjs/src/app/page.tsx
      tasks: build typecheck lint
  warm:
    needs: cold
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
        variant:
          - { provider: github-hosted, method: actions-cache, labels: '["ubuntu-24.04"]' }
          - { provider: celesto-large, method: actions-cache, labels: '["self-hosted","celesto-large"]' }
          - { provider: celesto-large, method: turbo-remote, labels: '["self-hosted","celesto-large"]' }
    uses: ./.github/workflows/turbo-real-repo-job.yml
    with:
      phase: warm
      provider: ${{ matrix.variant.provider }}
      method: ${{ matrix.variant.method }}
      runs_on: ${{ matrix.variant.labels }}
      key: turbo-${{ inputs.cache_namespace || github.run_id }}-${{ matrix.variant.provider }}-${{ matrix.variant.method }}-s${{ matrix.sample }}
      sample: ${{ matrix.sample }}
      repo: t3-oss/create-t3-turbo
      sha: 8f945b7bb3bfb3ca8358d48b1ff0214079bc11ee
      edit_file: apps/nextjs/src/app/page.tsx
      tasks: build typecheck lint
  partial:
    needs: warm
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
        variant:
          - { provider: github-hosted, method: actions-cache, labels: '["ubuntu-24.04"]' }
          - { provider: celesto-large, method: actions-cache, labels: '["self-hosted","celesto-large"]' }
          - { provider: celesto-large, method: turbo-remote, labels: '["self-hosted","celesto-large"]' }
    uses: ./.github/workflows/turbo-real-repo-job.yml
    with:
      phase: partial
      provider: ${{ matrix.variant.provider }}
      method: ${{ matrix.variant.method }}
      runs_on: ${{ matrix.variant.labels }}
      key: turbo-${{ inputs.cache_namespace || github.run_id }}-${{ matrix.variant.provider }}-${{ matrix.variant.method }}-s${{ matrix.sample }}
      sample: ${{ matrix.sample }}
      repo: t3-oss/create-t3-turbo
      sha: 8f945b7bb3bfb3ca8358d48b1ff0214079bc11ee
      edit_file: apps/nextjs/src/app/page.tsx
      tasks: build typecheck lint
