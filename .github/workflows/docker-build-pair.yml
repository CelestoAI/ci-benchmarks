name: One paired cache experiment
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME: {required: true}
      DOCKERHUB_TOKEN: {required: true}
    inputs:
      backend: {required: true, type: string}
      repetition: {required: true, type: number}
      namespace: {required: true, type: string}
      mode: {required: true, type: string}
permissions:
  contents: read
  packages: write
jobs:
  seed:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        provider: ${{ fromJSON((inputs.repetition == 2 || inputs.repetition == 4) && '["celesto","github"]' || '["github","celesto"]') }}
    uses: ./.github/workflows/docker-job.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      provider: ${{ matrix.provider }}
      backend: ${{ inputs.backend }}
      scenario: seed
      repetition: ${{ inputs.repetition }}
      namespace: ${{ inputs.namespace }}
  warm:
    needs: seed
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: ${{ fromJSON((inputs.mode == 'full' || inputs.mode == 'portable-pair' || inputs.mode == 'registry-pair') && '["unchanged","source","dependency"]' || '["unchanged"]') }}
        provider: [celesto, github]
    uses: ./.github/workflows/docker-job.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      provider: ${{ matrix.provider }}
      backend: ${{ inputs.backend }}
      scenario: ${{ matrix.scenario }}
      repetition: ${{ inputs.repetition }}
      namespace: ${{ inputs.namespace }}
