name: OVH ext4 journal confirmation
on:
  push:
    branches: [experiment/ovh-ext4-confirm-20261113]
    paths: [.github/workflows/ovh-ext4-journal.yml, scripts/ovh-ext4-canary.py, scripts/cache-core-waits.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: celesto-large
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Identify requested OVH host
        id: target
        run: python3 scripts/ovh-direct-guest.py identify
      - name: Start thread and journal wait observation
        id: observer
        if: steps.target.outputs.selected == 'true'
        run: python3 scripts/cache-core-waits.py start
      - name: Verify two small archive roundtrips and mount restoration
        if: steps.target.outputs.selected == 'true'
        run: sudo -n python3 scripts/ovh-ext4-canary.py prepare
      - name: 'Trial 1: baseline'
        if: steps.target.outputs.selected == 'true'
        run: sudo -n python3 scripts/ovh-ext4-canary.py trial 1
      - name: 'Trial 2: combined'
        if: steps.target.outputs.selected == 'true'
        run: sudo -n python3 scripts/ovh-ext4-canary.py trial 2
      - name: 'Trial 3: combined'
        if: steps.target.outputs.selected == 'true'
        run: sudo -n python3 scripts/ovh-ext4-canary.py trial 3
      - name: 'Trial 4: baseline'
        if: steps.target.outputs.selected == 'true'
        run: sudo -n python3 scripts/ovh-ext4-canary.py trial 4
      - name: 'Trial 5: combined'
        if: steps.target.outputs.selected == 'true'
        run: sudo -n python3 scripts/ovh-ext4-canary.py trial 5
      - name: 'Trial 6: baseline'
        if: steps.target.outputs.selected == 'true'
        run: sudo -n python3 scripts/ovh-ext4-canary.py trial 6
      - name: Restore captured guest mount and remove owned disk files
        if: always() && steps.target.outputs.selected == 'true'
        run: sudo -n python3 scripts/ovh-ext4-canary.py cleanup
      - name: Stop observer
        if: always() && steps.observer.outcome == 'success'
        run: python3 scripts/cache-core-waits.py stop
      - name: Upload raw clocks, mount flags, journal waits and integrity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ovh-ext4-confirm-${{ github.run_attempt }}
          path: /dev/shm/cache-native-profile
          retention-days: 14
