name: CI runner label rollout smoke
run-name: CI runner label rollout smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  bare:
    runs-on: celesto
    timeout-minutes: 4
    steps:
      - name: Verify Celesto runner
        run: |
          [[ "$RUNNER_NAME" == celesto-rs-* ]]
          printf 'assigned=%s\n' "$RUNNER_NAME"
          sleep 25

  with-self-hosted:
    runs-on: [self-hosted, celesto]
    timeout-minutes: 4
    steps:
      - name: Verify Celesto runner
        run: |
          [[ "$RUNNER_NAME" == celesto-rs-* ]]
          printf 'assigned=%s\n' "$RUNNER_NAME"
          sleep 25

  unsupported-explicit:
    runs-on: [self-hosted, linux, x64, celesto]
    timeout-minutes: 4
    steps:
      - run: exit 1

  generic-only:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 4
    steps:
      - name: Verify assignment stays off Celesto
        run: |
          [[ "$RUNNER_NAME" != celesto-* ]]
          printf 'assigned=%s\n' "$RUNNER_NAME"
