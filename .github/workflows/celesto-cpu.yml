name: CI metrics calibration
run-name: CI metrics calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: celesto-large
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run calibrated phases and independently sample the VM
        run: python3 scripts/ci-usage-calibration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-usage-reference
          path: ci-usage-reference.jsonl
