# Cache benchmark: Docker layer cache, GitHub Actions vs Celesto CI. Cold jobs start empty
# and save; warm jobs run on fresh runners and restore what cold saved.
# Summarize with: node cache-bench/collect.mjs <run-id>
name: Cache benchmark - Docker layer cache
on:
  # A new workflow can be dispatched only from the default branch; until this
  # lands on main, pushing a cache-bench/docker/** branch runs it with the defaults.
  push:
    branches: ['cache-bench/docker/**']
  workflow_dispatch:
    inputs:
      namespace:
        description: New unique name per experiment (cold and warm share it)
        type: string
        required: true
      celesto_runner:
        description: Celesto runner label (match GitHub's 4 vCPU / 16 GiB)
        type: string
        default: celesto-large
permissions:
  contents: read
jobs:
  cold:
    strategy:
      fail-fast: false
      matrix:
        sample: ['1', '2', '3']
        provider: [github, celesto]
    uses: ./.github/workflows/cache-bench-job.yml
    with:
      cache: docker
      phase: cold
      provider: ${{ matrix.provider }}
      runs_on: ${{ matrix.provider == 'github' && '["ubuntu-24.04"]' || format('["self-hosted","{0}"]', inputs.celesto_runner || 'celesto-large') }}
      key: ${{ inputs.namespace || format('run{0}-{1}', github.run_id, github.run_attempt) }}-docker-${{ matrix.provider }}-s${{ matrix.sample }}
      sample: ${{ matrix.sample }}
  warm:
    needs: cold
    if: always()
    strategy:
      fail-fast: false
      matrix:
        sample: ['1', '2', '3']
        provider: [github, celesto]
    uses: ./.github/workflows/cache-bench-job.yml
    with:
      cache: docker
      phase: warm
      provider: ${{ matrix.provider }}
      runs_on: ${{ matrix.provider == 'github' && '["ubuntu-24.04"]' || format('["self-hosted","{0}"]', inputs.celesto_runner || 'celesto-large') }}
      key: ${{ inputs.namespace || format('run{0}-{1}', github.run_id, github.run_attempt) }}-docker-${{ matrix.provider }}-s${{ matrix.sample }}
      sample: ${{ matrix.sample }}
