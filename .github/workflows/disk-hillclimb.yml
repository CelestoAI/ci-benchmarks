# Hill-climb of QEMU disk settings for ephemeral CI VMs. Boots the prod microvm
# command line (QEMU 8.2.2, Celesto CI kernel) on a GitHub-hosted runner, on its
# local temp SSD ("local") and on its network OS disk ("network").
name: Disk hill-climb
on:
  push:
    branches: [bench/disk-probe-20261114]
    paths: [scripts/hillclimb/**, .github/workflows/disk-hillclimb.yml]
permissions:
  contents: read
env:
  KERNEL_URL: https://github.com/CelestoAI/Celesto/releases/download/kernels-2026.10.28.0/vmlinux-github-ci-amd64.image
  KERNEL_SHA256: 52fc02f5fd3140f46e00dd7d8498eba0a15e3ba212d0ba13dcf379cd0932d829
  QEMU_LATEST: 11.1.3   # latest stable on qemu.org/download as of 2026-11-15; configs opt in with "qemu": "latest"
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      qemu_versions: ${{ steps.m.outputs.qemu_versions }}
      key: ${{ steps.m.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          it = json.load(open("scripts/hillclimb/iteration.json"))
          # "qemu": "<version>" (or "latest") runs a source build of that release; absent means the distro QEMU.
          ver = lambda c: {"latest": os.environ["QEMU_LATEST"], "system": ""}.get(c.get("qemu", "system"), c.get("qemu", ""))
          # Paired design: every non-baseline job also runs the baseline on the same
          # runner, because GitHub hands out runners of different speeds.
          base = next(c for c in it["configs"] if c["id"] == it["baseline"])
          thin = lambda c: "1" if c.get("layout") == "thin" else ""
          inc = [{"id": c["id"], "cls": cls, "rep": r, "cfg": json.dumps(c), "qver": ver(c), "thin": thin(c) or (thin(base) if c["id"] != base["id"] else ""),
                  "base": "" if c["id"] == base["id"] else json.dumps(base), "bqver": "" if c["id"] == base["id"] else ver(base)}
                 for c in it["configs"] for cls in it["classes"] for r in range(1, it["repeats"] + 1)]
          print("matrix=" + json.dumps({"include": inc}))
          print("qemu_versions=" + json.dumps(sorted({ver(c) for c in it["configs"]} - {""})))
          PY
          echo "key=hc-rootfs-${{ hashFiles('scripts/hillclimb/build-rootfs.sh') }}" >> "$GITHUB_OUTPUT"
  rootfs:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: c
        uses: actions/cache/restore@v4
        with: { path: rootfs, key: "${{ needs.plan.outputs.key }}", lookup-only: true }
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo bash scripts/hillclimb/build-rootfs.sh /tmp/rfs
          mkdir -p rootfs && sudo tar -cSf - -C /tmp/rfs base.raw | zstd -T0 -3 -q > rootfs/base.raw.tar.zst
          ls -la rootfs
      - if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: rootfs, key: "${{ needs.plan.outputs.key }}" }
  qemu:
    needs: plan
    if: needs.plan.outputs.qemu_versions != '[]'
    continue-on-error: true   # one version failing to build only fails the jobs that use it
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJSON(needs.plan.outputs.qemu_versions) }}
    runs-on: ubuntu-24.04
    steps:
      - id: c
        uses: actions/cache/restore@v4
        with: { path: "~/qemu-${{ matrix.ver }}", key: "qemu-${{ matrix.ver }}-v2", lookup-only: true }
      - if: steps.c.outputs.cache-hit != 'true' && startsWith(matrix.ver, 'ubuntu-')
        env:
          VER: ${{ matrix.ver }}
        run: |
          # Prebuilt: Ubuntu's own QEMU package from a newer release, unpacked as a root
          # filesystem that run-config.sh chroots into (its glibc is newer than the runner's).
          rel=${VER#ubuntu-}; out="$HOME/qemu-$VER"; mkdir -p "$out"
          docker run --name qrfs "ubuntu:$rel" bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils >/dev/null'
          docker export qrfs | tar -x -C "$out" --no-same-owner --exclude='dev/*' --exclude='proc/*' --exclude='sys/*' --exclude='run/*'
          docker rm qrfs >/dev/null
          chmod -R u+rwX "$out"   # the cache step reads every file as this user
          sudo chroot "$out" /usr/bin/qemu-system-x86_64 --version | head -1; du -sh "$out"
      - if: steps.c.outputs.cache-hit != 'true' && !startsWith(matrix.ver, 'ubuntu-')
        env:
          VER: ${{ matrix.ver }}
        run: |
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential ninja-build pkg-config python3-venv \
            flex bison libglib2.0-dev libpixman-1-dev libaio-dev liburing-dev zlib1g-dev >/dev/null
          curl -fsSL -o /tmp/q.tar.xz "https://download.qemu.org/qemu-${VER}.tar.xz" && sha256sum /tmp/q.tar.xz
          mkdir /tmp/q && tar -xJf /tmp/q.tar.xz -C /tmp/q --strip-components=1 && cd /tmp/q
          # Same flags for every version, so versions compare like with like.
          ./configure --prefix="$HOME/qemu-$VER" --target-list=x86_64-softmmu --enable-kvm --enable-linux-aio --enable-linux-io-uring \
            --enable-tools --disable-docs --disable-gtk --disable-sdl --disable-vnc --disable-werror >/dev/null
          make -j"$(nproc)" >/dev/null && make install >/dev/null && "$HOME/qemu-$VER/bin/qemu-system-x86_64" --version | head -1
      - if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: "~/qemu-${{ matrix.ver }}", key: "qemu-${{ matrix.ver }}-v2" }
  bench:
    needs: [plan, rootfs, qemu]
    if: always() && needs.rootfs.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.qemu.result)
    name: ${{ matrix.id }} ${{ matrix.cls }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with: { path: rootfs, key: "${{ needs.plan.outputs.key }}", fail-on-cache-miss: true }
      - if: matrix.qver != ''
        uses: actions/cache/restore@v4
        with: { path: "~/qemu-${{ matrix.qver }}", key: "qemu-${{ matrix.qver }}-v2", fail-on-cache-miss: true }
      - if: matrix.bqver != '' && matrix.bqver != matrix.qver
        uses: actions/cache/restore@v4
        with: { path: "~/qemu-${{ matrix.bqver }}", key: "qemu-${{ matrix.bqver }}-v2", fail-on-cache-miss: true }
      - name: Host setup
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils xfsprogs zstd jq lvm2 thin-provisioning-tools >/dev/null
          qemu-system-x86_64 --version | head -1; uname -r; lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,MODEL; df -h / /mnt || true
          curl -fsSL -o /tmp/kernel "$KERNEL_URL" && echo "$KERNEL_SHA256  /tmp/kernel" | sha256sum -c -
      - name: Disk class
        env:
          THIN: ${{ matrix.thin }}
        run: |
          if [ "${{ matrix.cls }}" = local ] && [ "$THIN" = 1 ]; then
            # dm-thin jobs need room for both layouts: one 22 GiB null_blk with discard (deleted
            # data frees its RAM), split in two with dm-linear: XFS for qcow2, an LVM thin pool.
            modinfo null_blk >/dev/null 2>&1 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null
            # Named nullb0 so the disk is /dev/nullb0 whether the kernel names it by index or by configfs name.
            sudo modprobe null_blk nr_devices=0 && d=/sys/kernel/config/nullb/nullb0 && sudo mkdir "$d"
            for kv in size=22528 memory_backed=1 discard=1 queue_mode=2 irqmode=2 completion_nsec=20000 hw_queue_depth=256 submit_queues=4 blocksize=4096 power=1; do
              echo "${kv#*=}" | sudo tee "$d/${kv%%=*}" >/dev/null; done
            src=/dev/nullb0; sudo udevadm settle; for _ in $(seq 50); do [ -b $src ] && break; sleep 0.2; done
            ls -l /dev/nullb* /dev/nb* 2>/dev/null || true; [ -b $src ]; half=$(( $(sudo blockdev --getsz $src) / 2 ))
            sudo dmsetup create hcxfs --table "0 $half linear $src 0" && sudo dmsetup create hcthin --table "0 $half linear $src $half"
            sudo mkfs.xfs -q -f -m reflink=1 /dev/mapper/hcxfs && sudo mkdir -p /local && sudo mount -o discard /dev/mapper/hcxfs /local && root=/local/hc
            pv=/dev/mapper/hcthin
          elif [ "${{ matrix.cls }}" = local ]; then
            # No local SSD on these runners: a RAM-backed null_blk device with 20 us
            # completions stands in for local NVMe.
            modinfo null_blk >/dev/null 2>&1 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null
            sudo modprobe null_blk nr_devices=1 gb=11 memory_backed=1 queue_mode=2 irqmode=2 completion_nsec=20000 hw_queue_depth=256 submit_queues=4 bs=4096
            src=/dev/nullb0
            sudo mkfs.xfs -q -f -m reflink=1 "$src" && sudo mkdir -p /local && sudo mount "$src" /local && root=/local/hc
          else
            # The runner's only disk is a remote Azure disk over NVMe: the EBS / OVH stand-in.
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
            src=$(findmnt -no SOURCE /)
            sudo truncate -s 64G /xfsnet.img && loop=$(sudo losetup --direct-io=on -f --show /xfsnet.img)
            sudo mkfs.xfs -q -f -m reflink=1 "$loop" && sudo mkdir -p /net && sudo mount "$loop" /net && root=/net/hc
            if [ "$THIN" = 1 ]; then sudo truncate -s 64G /thin.img && pv=$(sudo losetup --direct-io=on -f --show /thin.img); fi
          fi
          if [ "$THIN" = 1 ]; then  # thin pool; 64K chunks, zeroing on (a VM must never read another VM's old data)
            sudo pvcreate -qq "$pv" && sudo vgcreate -qq hc "$pv" && sudo lvcreate -qq --type thin-pool -l 90%FREE --chunksize 64k --zero y -n pool hc
            sudo lvs -o lv_name,lv_size,chunk_size,zero,discards hc
          fi
          echo "ROOT=$root" >> "$GITHUB_ENV"; echo "DEV=$(lsblk -no KNAME "$src" | tail -1)" >> "$GITHUB_ENV"
          sudo mkdir -p "$root" && zstd -dc rootfs/base.raw.tar.zst | sudo tar -xSf - -C "$root"
          df -h "$root"
      - name: Run
        working-directory: scripts/hillclimb
        env:
          CFG: ${{ matrix.cfg }}
          BASE: ${{ matrix.base }}
          REP: ${{ matrix.rep }}
        run: |
          run() { sudo -E env QEMU_ROOT="$HOME" QEMU_LATEST="$QEMU_LATEST" CFG="$1" CLASS="${{ matrix.cls }}" REP="$REP" ROOT="$ROOT" DEV="$DEV" KERNEL=/tmp/kernel OUT="$2" bash run-config.sh; }
          if [ -z "$BASE" ]; then run "$CFG" /tmp/out
          elif [ $((REP % 2)) = 1 ]; then run "$BASE" /tmp/base; run "$CFG" /tmp/out   # alternate order across repeats
          else run "$CFG" /tmp/out; run "$BASE" /tmp/base; fi
          [ -f /tmp/base/result.json ] && sudo cp /tmp/base/result.json /tmp/out/base.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hc-${{ matrix.id }}-${{ matrix.cls }}-${{ matrix.rep }}
          path: /tmp/out/*.json
          if-no-files-found: warn
