name: First-download range matrix
on:
  push:
    branches: [codex/first-download-range-matrix-20261116]
permissions:
  contents: read
concurrency:
  group: first-download-range-matrix-20261116
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: celesto-large
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          path: .harness
      - name: Build download geometry experiment
        env:
          MATRIX_SOURCE_URL: ${{ secrets.FIRST_DOWNLOAD_MATRIX_SOURCE_20261116 }}
          MATRIX_SOURCE_SHA256: d129cb49115ef969ebde0795389c70772734e172a40081f8f5fcc33d4986c8c9
        run: python3 .harness/scripts/first-download-matrix.py setup
      - name: 'b1-r16-c64: generate and select'
        run: python3 .harness/scripts/first-download-matrix.py generate 1 16 64
      - name: 'b1-r16-c64: save'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: cache-file
          key: first-dl-${{ github.run_id }}-${{ github.run_attempt }}-b1-r16-c64
      - name: 'b1-r16-c64: remove'
        run: rm cache-file
      - name: 'b1-r16-c64: restore'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          CELESTO_EXPERIMENT_RANGE_MIB: '16'
          CELESTO_EXPERIMENT_CONCURRENCY: '64'
        with:
          path: cache-file
          key: first-dl-${{ github.run_id }}-${{ github.run_attempt }}-b1-r16-c64
