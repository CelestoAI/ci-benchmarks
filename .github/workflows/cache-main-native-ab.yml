name: First-download adaptive profile validation
on:
  push:
    branches: [codex/first-download-2m-ceiling-20261116]
permissions:
  contents: read
concurrency:
  group: first-download-size-matrix-20261116
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: celesto-large
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          path: .harness
      - name: Build released cache components for size matrix
        env:
          MATRIX_SOURCE_URL: ${{ secrets.FIRST_DOWNLOAD_CEILING_SOURCE_20261116 }}
          MATRIX_SOURCE_SHA256: 93e36801af415a93ce5355c4203989f1f33a5c5ecb0b03ac70e2752901c3e4e2
        run: python3 .harness/scripts/first-download-size-matrix.py setup
      - name: Validate the adaptive profile and final ceiling
        uses: ./.harness/.github/actions/first-download-size-matrix
        env:
          MATRIX_PROGRESS_PUT_URL: ${{ secrets.FIRST_DOWNLOAD_CEILING_PROGRESS_20261116 }}
      - name: Restore original helper
        if: always()
        run: python3 .harness/scripts/first-download-size-matrix.py cleanup
      - name: Publish verified size-matrix receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-download-ceiling-receipts
          path: /tmp/first-download-size-matrix-${{ github.run_id }}-${{ github.run_attempt }}/results
          if-no-files-found: warn
