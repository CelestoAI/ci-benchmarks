# Compares the two runs-on forms for Celesto CI: the size label alone, and
# the size label with self-hosted. Each job prints the runner that took it.
name: runs-on label forms

on:
  push:
    branches: [test/runs-on-label-forms]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  label-only:
    runs-on: celesto-micro
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show the runner
        run: |
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          uname -a
          nproc
          free -h

  with-self-hosted:
    runs-on: [self-hosted, celesto-micro]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show the runner
        run: |
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          uname -a
          nproc
          free -h
