# One-off diagnostic for slow 4K random writes; runs only on its own branch.
name: Disk probe
on:
  push:
    branches: [bench/disk-probe-20261114]
    paths: [scripts/disk-probe5.sh]
permissions:
  contents: read
jobs:
  probe:
    name: probe ${{ matrix.iteration }}
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: celesto-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fio jq bc >/dev/null
      - name: Probe
        env:
          ITER: ${{ matrix.iteration }}
        run: bash scripts/disk-probe5.sh
