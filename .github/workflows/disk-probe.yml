# One-off diagnostic for slow 4K random writes; runs only on its own branch.
name: Disk probe
on:
  push:
    branches: [bench/disk-probe-20261114]
permissions:
  contents: read
jobs:
  probe:
    name: lazyinit-${{ matrix.variant }} ${{ matrix.iteration }}
    strategy:
      fail-fast: false
      matrix:
        variant: ['on', 'off']
        iteration: [1, 2]
    runs-on: celesto-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fio jq >/dev/null
      - name: Probe
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/disk-probe3.sh
