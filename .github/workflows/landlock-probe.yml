# Checks whether Landlock works on GitHub-hosted runners and Celesto runners.
# Context: CelestoAI/celesto#742.
name: landlock-probe

on:
  push:
    branches: [probe/landlock]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04, ubuntu-24.04-arm, celesto-micro]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Kernel
        run: |
          uname -a
          . /etc/os-release && echo "$PRETTY_NAME"

      - name: Kernel config
        run: |
          cfg=/boot/config-$(uname -r)
          if [ -r "$cfg" ]; then src="$cfg"; cat_cmd=cat
          elif [ -r /proc/config.gz ]; then src=/proc/config.gz; cat_cmd=zcat
          else echo "No kernel config available"; exit 0; fi
          echo "source: $src"
          $cat_cmd "$src" | grep -E '^(# )?CONFIG_(SECURITY|SECURITYFS|SECURITY_LANDLOCK|SECURITY_APPARMOR|SECURITY_YAMA|SECURITY_SELINUX|LSM)[ =]'

      - name: Active LSMs
        run: |
          if [ ! -r /sys/kernel/security/lsm ]; then
            sudo mount -t securityfs securityfs /sys/kernel/security 2>&1 || true
          fi
          cat /sys/kernel/security/lsm 2>&1 || echo "/sys/kernel/security/lsm missing"
          echo
          sudo dmesg 2>/dev/null | grep -i landlock || echo "no landlock lines in dmesg"

      - name: Landlock ABI (syscall 444)
        run: |
          perl -e 'my $r = syscall(444, 0, 0, 1); if ($r < 0) { print "landlock_create_ruleset failed: errno=", $! + 0, " ($!)\n"; exit 0 } print "Landlock ABI version: $r\n"'

      - name: Landlock enforcement
        run: |
          cat > /tmp/ll.c <<'C'
          #define _GNU_SOURCE
          #include <linux/landlock.h>
          #include <sys/prctl.h>
          #include <sys/syscall.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <errno.h>
          #include <stdio.h>
          #include <string.h>
          int main(void) {
            struct landlock_ruleset_attr attr = { .handled_access_fs = LANDLOCK_ACCESS_FS_WRITE_FILE };
            int fd = syscall(SYS_landlock_create_ruleset, &attr, sizeof attr, 0);
            if (fd < 0) { printf("create_ruleset: %s\n", strerror(errno)); return 0; }
            if (prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0)) { perror("no_new_privs"); return 1; }
            if (syscall(SYS_landlock_restrict_self, fd, 0)) { printf("restrict_self: %s\n", strerror(errno)); return 1; }
            int out = open("/tmp/landlock-probe-write", O_WRONLY | O_CREAT | O_TRUNC, 0600);
            if (out >= 0) { printf("FAIL: write allowed after restrict_self\n"); return 1; }
            printf("PASS: write blocked after restrict_self (%s)\n", strerror(errno));
            return 0;
          }
          C
          sed -i 's/^          //' /tmp/ll.c
          if ! command -v gcc >/dev/null; then echo "gcc missing; skipping"; exit 0; fi
          gcc -O2 -o /tmp/ll /tmp/ll.c && /tmp/ll

      - name: setpriv
        run: |
          setpriv --version
          setpriv --help | grep -i landlock || echo "this setpriv has no --landlock-access option"
