      - name: Upload raw timings and hash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cache-size-sweep-celesto-${{ matrix.sample }}-${{ github.run_attempt }}
          path: ${{ env.PROFILE_ROOT }}
